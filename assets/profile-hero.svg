<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Sam Lung — AI Agent Platform, Mobile and Web3 Engineer</title>
  <desc id="desc">A system diagram connecting orchestration, context recovery and evidence-based delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#111a31"/>
      <stop offset="1" stop-color="#180d2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1090" cy="55" r="170" fill="#7c3aed" opacity=".10"/>
  <circle cx="65" cy="385" r="170" fill="#14b8a6" opacity=".09"/>
  <rect x="62" y="48" width="207" height="34" rx="17" fill="#0f172a" stroke="#334155"/>
  <circle cx="82" cy="65" r="5" fill="#2dd4bf" filter="url(#glow)"/>
  <text x="98" y="71" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="650" letter-spacing="1.4">SAM LUNG · IML1S</text>
  <text x="60" y="151" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="58" font-weight="780" letter-spacing="-1.2">AI AGENT PLATFORM</text>
  <rect x="62" y="171" width="725" height="4" rx="2" fill="url(#accent)"/>
  <text x="62" y="215" fill="#a5b4fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="520">Mobile systems · Web3 · Developer infrastructure</text>
  <text x="62" y="251" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">Provider-agnostic. Recoverable. Parallel. Verified by evidence.</text>

  <path d="M282 326H457M735 326H910" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
  <path d="M448 318L460 326L448 334M901 318L913 326L901 334" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <g>
    <rect x="62" y="286" width="220" height="82" rx="18" fill="#0f172a" stroke="#2dd4bf" stroke-opacity=".65"/>
    <text x="86" y="318" fill="#5eead4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" letter-spacing="1">ORCHESTRATE</text>
    <text x="86" y="346" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="620">Agents · Tools · MCP</text>
  </g>
  <g>
    <rect x="460" y="286" width="275" height="82" rx="18" fill="#0f172a" stroke="#60a5fa" stroke-opacity=".7"/>
